<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Hub Quota</title>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --card-2: #f0f0ed; --line: #e3e3df; --grid: #ececE8;
  --text: #17171a; --muted: #6b6b72; --faint: #9a9aa2;
  --claude: #d9704f; --codex: #4f7be8; --good: #2f9e6b; --warn: #c98a1a; --bad: #d14b4b;
  --chip: #ebebe7; --chip-on: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090a; --card: #121214; --card-2: #19191c; --line: #232327; --grid: #1d1d21;
    --text: #ededee; --muted: #9b9ba3; --faint: #64646c;
    --claude: #f0805e; --codex: #7aa0ff; --good: #4cc38a; --warn: #e5a73b; --bad: #f06a6a;
    --chip: #18181b; --chip-on: #26262a; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090a; --card: #121214; --card-2: #19191c; --line: #232327; --grid: #1d1d21;
  --text: #ededee; --muted: #9b9ba3; --faint: #64646c;
  --claude: #f0805e; --codex: #7aa0ff; --good: #4cc38a; --warn: #e5a73b; --bad: #f06a6a;
  --chip: #18181b; --chip-on: #26262a; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px 60px; }
button { font: inherit; color: inherit; }
.mono { font-variant-numeric: tabular-nums; }

header.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; }
.brand .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--card-2); display: grid; place-items: center; border: 1px solid var(--line); }
h1 { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin: 0; }
.sub { color: var(--muted); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; box-shadow: var(--shadow); }
.btn:hover { background: var(--card-2); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.primary:hover { opacity: .9; }
.btn.icon { padding: 8px; }
.btn[disabled] { opacity: .55; cursor: progress; }

.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0 18px; }
.seg { display: inline-flex; background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg .lbl { color: var(--muted); padding: 5px 8px 5px 10px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; cursor: pointer; color: var(--muted); display: inline-flex; gap: 7px; align-items: center; }
.seg button.on { background: var(--chip-on); color: var(--text); box-shadow: var(--shadow); }
.seg button .n { color: var(--faint); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px 18px; margin-bottom: 18px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-head .name { font-size: 17px; font-weight: 650; }
.card-head .count { color: var(--muted); }
.summary { display: flex; gap: 28px 40px; align-items: flex-end; flex-wrap: wrap; margin: 10px 0 6px; }
.big { font-size: 48px; font-weight: 650; letter-spacing: -.03em; line-height: 1; }
.big small { font-size: 15px; font-weight: 450; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.stats { display: flex; gap: 18px 36px; flex-wrap: wrap; margin-left: auto; }
.stat .k { color: var(--muted); font-size: 13px; }
.stat .v { font-weight: 600; white-space: nowrap; }
.chart { position: relative; margin-top: 8px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .tip { position: absolute; top: 0; right: 0; background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 13px; pointer-events: none; white-space: nowrap; }
.legend { display: flex; gap: 22px; align-items: center; color: var(--muted); font-size: 13px; margin: 2px 0 14px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }
.note { color: var(--faint); font-size: 12.5px; }

.tbl-wrap { overflow-x: auto; border-top: 1px solid var(--line); margin: 0 -24px; padding: 0 24px; }
table { width: 100%; border-collapse: collapse; min-width: 860px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 12px 10px 8px; white-space: nowrap; }
td { padding: 11px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
tr:first-child td { border-top: 0; }
th:first-child, td:first-child { padding-left: 0; }
.acct { font-weight: 550; }
.acct .plan { color: var(--muted); font-weight: 450; margin-left: 6px; font-size: 12.5px; text-transform: capitalize; }
.meter { width: 120px; height: 7px; border-radius: 4px; background: var(--card-2); overflow: hidden; border: 1px solid var(--line); }
.meter > span { display: block; height: 100%; border-radius: 4px; }
.rem { display: flex; gap: 10px; align-items: center; }
.win { white-space: nowrap; }
.win .wl { color: var(--muted); margin-right: 6px; }
.win .rs { color: var(--faint); margin-left: 6px; font-size: 12.5px; }
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; border: 1px solid var(--line); background: var(--card-2); white-space: nowrap; margin: 2px 4px 2px 0; }
.badge.next { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }

.login { max-width: 420px; margin: 14vh auto 0; }
.login input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); color: var(--text); font: inherit; margin: 14px 0 12px; }
.err { color: var(--bad); min-height: 1.4em; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
@media (max-width: 640px) {
  .wrap { padding: 18px 16px 40px; }
  .big { font-size: 38px; }
  .stats { margin-left: 0; }
  .card { padding: 18px 16px 14px; }
  .tbl-wrap { margin: 0 -16px; padding: 0 16px; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
const HOUR = 3600e3, DAY = 24 * HOUR;
const PROVIDERS = {
  claude: { name: "Claude", color: "var(--claude)", icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:var(--claude)"><path d="M12 2l1.6 6.2L19.8 4l-4.2 6.1L22 12l-6.4 1.9 4.2 6.1-6.2-4.2L12 22l-1.6-6.2L4.2 20l4.2-6.1L2 12l6.4-1.9L4.2 4l6.2 4.2z"/></svg>' },
  codex: { name: "Codex", color: "var(--codex)", icon: '<svg width="18" height="18" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="var(--codex)"/><path d="M8 9l3 3-3 3M13 15h4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
};

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("cpa-quota:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("cpa-quota:" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("cpa-quota:" + k); } catch {} },
};
const state = {
  key: store.get("key", ""), tab: store.get("tab", "all"), burnH: store.get("burnH", 3),
  pastD: store.get("pastD", 3), futureD: store.get("futureD", 7), showEmails: store.get("showEmails", false),
  report: null, samples: [], loading: false, refreshing: false, error: "", lastLoad: 0,
};
const theme = store.get("theme", "");
if (theme) document.documentElement.dataset.theme = theme;

/* ---------- format ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmtDur(ms) {
  if (ms <= 0) return "now";
  const m = Math.round(ms / 60e3), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d > 0) return d + "d " + h + "h";
  if (h > 0) return h + "h " + mm + "m";
  return mm + "m";
}
function fmtTime(t, now) {
  const d = new Date(t);
  const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (Math.abs(t - now) < 6.5 * DAY) return d.toLocaleDateString([], { weekday: "short" }) + " " + time;
  return d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + time;
}
const pct = (v) => (Math.round(v * 10) / 10).toLocaleString() + "%";
const pct0 = (v) => Math.round(v).toLocaleString() + "%";
function maskEmail(e) {
  if (!e || state.showEmails) return e || "";
  const [u, d] = e.split("@");
  return (u ? u[0] : "") + "•••" + (d ? "@" + d : "");
}
function windowLabel(w) {
  const s = w.window_seconds || 0;
  if (!s) return "Limit";
  if (s <= 6 * 3600) return Math.round(s / 3600) + "h";
  if (s >= 6 * 86400 && s <= 8 * 86400) return "Weekly";
  return Math.round(s / 86400) + "d";
}

/* ---------- model ---------- */
function windowsOf(c, now) {
  const out = [];
  for (const slot of ["primary", "secondary"]) {
    const w = c[slot];
    if (!w) continue;
    const resetAt = w.reset_at ? Date.parse(w.reset_at) : 0;
    const used = resetAt && now >= resetAt ? 0 : Math.min(100, Math.max(0, w.used_percent));
    out.push({ slot: slot === "primary" ? "p" : "s", label: windowLabel(w), used, resetAt, win: (w.window_seconds || 7 * 86400) * 1000 });
  }
  return out;
}
const effRemaining = (wins) => (wins.length ? Math.min(...wins.map((w) => 100 - w.used)) : 100);

// Burn rate (% of the window per hour) from recorded samples over the last windowMs.
function burnRate(samples, slot, now, windowMs) {
  const from = now - windowMs;
  let prev = null, sum = 0, first = null;
  for (const s of samples) {
    const v = s[slot];
    if (v == null) continue;
    const t = Date.parse(s.t);
    if (t < from) { prev = { t, v }; continue; }
    if (prev) {
      if (first === null) first = Math.max(prev.t, from);
      if (v > prev.v) sum += v - prev.v; // drops are resets
    } else if (first === null) first = t;
    prev = { t, v };
  }
  if (first === null) return null;
  const span = (now - first) / HOUR;
  return span < 0.25 ? null : sum / span;
}

function buildProvider(provider, creds, samplesById, now, opts) {
  const accounts = creds.map((c) => {
    const wins = windowsOf(c, now);
    const hist = samplesById[c.auth_id] || [];
    for (const w of wins) w.rate = burnRate(hist, w.slot, now, opts.burnH * HOUR);
    const exhaustedUntil = c.exhausted_until ? Date.parse(c.exhausted_until) : 0;
    const rem = exhaustedUntil > now ? 0 : effRemaining(wins);
    const binding = wins.length ? wins.reduce((a, b) => (100 - a.used <= 100 - b.used ? a : b)) : null;
    return { c, wins, rem, exhaustedUntil, binding, hist };
  });
  const usable = accounts.filter((a) => !a.c.stale && !(a.exhaustedUntil > now));
  const best = usable.length ? usable.reduce((a, b) => (a.c.score >= b.c.score ? a : b)) : null;
  accounts.sort((a, b) => b.c.score - a.c.score);
  const capacity = accounts.length * 100;
  const remaining = accounts.reduce((s, a) => s + a.rem, 0);
  const rates = accounts.map((a) => (a.binding ? a.binding.rate : null));
  const known = rates.filter((r) => r != null);
  const burn = known.length ? known.reduce((s, r) => s + r, 0) : null;

  // Recorded pool series: sum of each account's last-known remaining.
  const ids = new Set(accounts.map((a) => a.c.auth_id));
  const merged = [];
  for (const id of ids) for (const s of samplesById[id] || []) merged.push(s);
  merged.sort((a, b) => Date.parse(a.t) - Date.parse(b.t));
  const last = new Map(), recorded = [];
  for (let i = 0; i < merged.length; i++) {
    const s = merged[i], t = Date.parse(s.t);
    const vals = [s.p, s.s].filter((v) => v != null).map((v) => 100 - Math.min(100, v));
    last.set(s.id, vals.length ? Math.min(...vals) : 100);
    const next = merged[i + 1];
    if (next && Date.parse(next.t) - t < 90e3) continue; // one point per poll cycle
    if (last.size === ids.size) recorded.push({ t, v: [...last.values()].reduce((a, b) => a + b, 0) });
  }
  recorded.push({ t: now, v: remaining });

  // Projection: each window keeps burning at its recorded rate; resets restore it.
  const sim = accounts.map((a) => ({
    a, dead: a.exhaustedUntil > now ? a.exhaustedUntil : 0,
    wins: a.wins.map((w) => ({ ...w, rate: w.rate || 0 })),
  }));
  const step = 10 * 60e3, end = now + opts.futureD * DAY;
  const projected = [{ t: now, v: remaining }], jumps = [];
  let firstEmpty = accounts.find((a) => a.rem <= 0.05) ? { t: now, a: accounts.find((a) => a.rem <= 0.05) } : null;
  let poolEmpty = remaining <= 0.05 ? now : 0;
  const remOf = (s, t) => {
    if (s.dead && t < s.dead) return 0;
    return s.wins.length ? Math.min(...s.wins.map((w) => 100 - w.used)) : 100;
  };
  for (let t = now + step; t <= end; t += step) {
    const before = sim.reduce((sum, s) => sum + remOf(s, t - step), 0);
    let gained = 0;
    for (const s of sim) {
      const r0 = remOf(s, t - step);
      for (const w of s.wins) {
        w.used = Math.min(100, w.used + w.rate * (step / HOUR));
        if (w.resetAt && t >= w.resetAt) {
          w.used = 0;
          while (w.resetAt <= t) w.resetAt += w.win;
        }
      }
      if (s.dead && t >= s.dead) s.dead = 0;
      const r1 = remOf(s, t);
      if (r1 > r0 + 0.5) gained += r1 - r0;
      if (!firstEmpty && r1 <= 0.05 && r0 > 0.05) firstEmpty = { t, a: s.a };
    }
    const v = sim.reduce((sum, s) => sum + remOf(s, t), 0);
    if (gained > 0.5) jumps.push({ t, v, gain: gained, from: before });
    if (!poolEmpty && v <= 0.05) poolEmpty = t;
    projected.push({ t, v });
  }
  // Earliest restoring reset across accounts, independent of projection steps.
  let nextReset = null;
  for (const a of accounts) for (const w of a.wins) {
    if (w.used > 0.5 && w.resetAt > now && (!nextReset || w.resetAt < nextReset.t)) nextReset = { t: w.resetAt, gain: w.used, a };
  }
  // Prefer the projected jump so the stat matches the chart (it includes burn until the reset).
  if (jumps.length && (!nextReset || jumps[0].t <= nextReset.t + step)) nextReset = { t: jumps[0].t, gain: jumps[0].gain };
  return { provider, accounts, best, capacity, remaining, burn, recorded, projected, jumps, firstEmpty, poolEmpty, nextReset };
}

/* ---------- chart ---------- */
function renderChart(el, m, now, opts) {
  const W = Math.max(320, el.clientWidth), H = 280, padL = 46, padR = 12, padT = 26, padB = 30;
  const x0 = now - opts.pastD * DAY, x1 = now + opts.futureD * DAY;
  const X = (t) => padL + ((t - x0) / (x1 - x0)) * (W - padL - padR);
  const Y = (v) => padT + (1 - v / m.capacity) * (H - padT - padB);
  const color = PROVIDERS[m.provider].color;
  const pathOf = (pts) => pts.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1)).join("");
  // Steps: resets are vertical jumps, so hold the previous value until the jump.
  const stepped = (pts) => {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      if (i && pts[i].v - pts[i - 1].v > 0.5) out.push({ t: pts[i].t, v: pts[i - 1].v });
      out.push(pts[i]);
    }
    return out;
  };
  const rec = stepped(m.recorded.filter((p) => p.t >= x0 - DAY));
  const proj = stepped(m.projected);
  const recClip = rec.filter((p) => p.t >= x0);
  if (rec.length && recClip.length && recClip[0] !== rec[0]) recClip.unshift({ t: x0, v: rec[rec.findIndex((p) => p.t >= x0) - 1]?.v ?? recClip[0].v });
  const all = [...recClip, ...proj.slice(1)];
  const gid = "g-" + m.provider;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(PROVIDERS[m.provider].name)} pool remaining">`;
  svg += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient><clipPath id="c-${m.provider}"><rect x="${padL}" y="0" width="${W - padL - padR}" height="${H}"/></clipPath></defs>`;
  for (const f of [0, 0.5, 1]) {
    const y = Y(m.capacity * f);
    svg += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="var(--grid)"/>`;
    svg += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${pct0(m.capacity * f)}</text>`;
  }
  const days = [];
  const start = new Date(x0); start.setHours(24, 0, 0, 0);
  for (let t = start.getTime(); t < x1; t += DAY) days.push(t);
  const every = Math.ceil(days.length / Math.max(2, Math.floor((W - padL) / 70)));
  days.forEach((t, i) => {
    const x = X(t);
    svg += `<line x1="${x}" x2="${x}" y1="${padT}" y2="${H - padB}" stroke="var(--grid)"/>`;
    if (i % every === 0) svg += `<text x="${x + 4}" y="${H - 10}" font-size="11" fill="var(--faint)">${esc(new Date(t).toLocaleDateString([], { weekday: "short", day: "numeric" }))}</text>`;
  });
  svg += `<g clip-path="url(#c-${m.provider})">`;
  if (all.length > 1) svg += `<path d="${pathOf(all)}L${X(all[all.length - 1].t)} ${Y(0)}L${X(all[0].t)} ${Y(0)}Z" fill="url(#${gid})"/>`;
  if (recClip.length > 1) svg += `<path d="${pathOf(recClip)}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  svg += `<path d="${pathOf(proj)}" fill="none" stroke="${color}" stroke-width="1.8" stroke-dasharray="6 5" stroke-linejoin="round"/>`;
  let lastLabel = -1e9;
  for (const j of m.jumps) {
    const x = X(j.t);
    if (x - lastLabel < 46) continue;
    lastLabel = x;
    svg += `<text x="${x}" y="${Math.max(padT - 8, Y(j.v) - 8)}" text-anchor="middle" font-size="11" fill="var(--muted)">+${pct0(j.gain)}</text>`;
  }
  if (m.poolEmpty && m.poolEmpty <= x1) svg += `<circle cx="${X(m.poolEmpty)}" cy="${Y(0)}" r="5" fill="var(--card)" stroke="var(--text)" stroke-width="2"/>`;
  svg += `</g>`;
  const nx = X(now);
  svg += `<line x1="${nx}" x2="${nx}" y1="${padT - 6}" y2="${H - padB}" stroke="var(--faint)"/><text x="${nx}" y="${padT - 12}" text-anchor="middle" font-size="11" fill="var(--muted)">Now</text>`;
  svg += `<circle cx="${nx}" cy="${Y(m.remaining)}" r="4" fill="${color}"/>`;
  svg += `<g class="hover" visibility="hidden"><line class="hl" y1="${padT}" y2="${H - padB}" stroke="var(--muted)" stroke-dasharray="2 3"/><circle class="hd" r="4" fill="${color}" stroke="var(--card)" stroke-width="2"/></g>`;
  svg += `<rect x="${padL}" y="0" width="${W - padL - padR}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div>`;
  el.innerHTML = svg;
  const hit = el.querySelector(".hit"), hov = el.querySelector(".hover"), tip = el.querySelector(".tip");
  const valueAt = (t) => {
    const pts = t <= now ? recClip : proj;
    let best = null;
    for (const p of pts) { if (p.t <= t) best = p; else break; }
    return best || pts[0];
  };
  const move = (ev) => {
    const r = el.getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const t = x0 + ((px - padL) / (W - padL - padR)) * (x1 - x0);
    const p = valueAt(Math.min(x1, Math.max(x0, t)));
    if (!p) return;
    hov.setAttribute("visibility", "visible");
    hov.querySelector(".hl").setAttribute("x1", px); hov.querySelector(".hl").setAttribute("x2", px);
    hov.querySelector(".hd").setAttribute("cx", px); hov.querySelector(".hd").setAttribute("cy", Y(p.v));
    tip.hidden = false;
    tip.textContent = fmtTime(t, now) + " · " + pct0(p.v) + " left" + (t > now ? " · projected" : "");
  };
  hit.addEventListener("mousemove", move);
  hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("mouseleave", () => { hov.setAttribute("visibility", "hidden"); tip.hidden = true; });
}

/* ---------- views ---------- */
function seg(label, name, options, cur) {
  return `<div class="seg">${label ? `<span class="lbl">${label}</span>` : ""}${options.map(([v, t]) =>
    `<button data-set="${name}" data-v="${esc(v)}" class="${String(v) === String(cur) ? "on" : ""}">${t}</button>`).join("")}</div>`;
}

function providerCard(m, now) {
  const P = PROVIDERS[m.provider];
  const fe = m.firstEmpty
    ? `${esc(maskEmail(m.firstEmpty.a.c.email) || m.firstEmpty.a.c.auth_id)} ${m.firstEmpty.t <= now ? "now" : "in " + fmtDur(m.firstEmpty.t - now)}`
    : `Not by ${esc(new Date(now + state.futureD * DAY).toLocaleDateString([], { month: "short", day: "numeric" }))}`;
  const pe = m.poolEmpty ? (m.poolEmpty <= now ? "Now" : esc(fmtTime(m.poolEmpty, now))) : `Not by ${esc(new Date(now + state.futureD * DAY).toLocaleDateString([], { month: "short", day: "numeric" }))}`;
  const nr = m.nextReset ? `+${pct0(m.nextReset.gain)} ${esc(fmtTime(m.nextReset.t, now))}` : "—";
  const burn = m.burn == null ? `<span class="note">collecting…</span>` : pct(m.burn) + "/h";
  const rows = m.accounts.map((a) => {
    const c = a.c, badges = [];
    if (m.best === a) badges.push(`<span class="badge next">● Next session</span>`);
    if (a.exhaustedUntil > now) badges.push(`<span class="badge bad">Exhausted · back in ${fmtDur(a.exhaustedUntil - now)}</span>`);
    if (c.stale) badges.push(`<span class="badge warn">Stale data</span>`);
    if (c.extra_usage_enabled) badges.push(`<span class="badge" title="Paid overage is enabled on this account. The hub never routes to it once its plan limit is hit.">Extra usage on · not used</span>`);
    const credits = (c.reset_credit_expiries || []).map((e) => Date.parse(e)).filter((t) => t > now).sort((a, b) => a - b);
    const barColor = a.rem < 10 ? "var(--bad)" : a.rem < 30 ? "var(--warn)" : P.color;
    const wins = a.wins.length ? a.wins.map((w) =>
      `<div class="win mono"><span class="wl">${esc(w.label)}</span>${pct0(w.used)} used${w.resetAt ? `<span class="rs">resets in ${fmtDur(w.resetAt - now)}</span>` : ""}${w.rate != null ? `<span class="rs">· ${pct(w.rate)}/h</span>` : ""}</div>`).join("") : `<span class="note">no windows reported</span>`;
    return `<tr>
      <td><div class="acct">${esc(maskEmail(c.email) || c.auth_id)}${c.plan ? `<span class="plan">${esc(c.plan)}</span>` : ""}</div></td>
      <td><div class="rem"><div class="meter"><span style="width:${a.rem.toFixed(1)}%;background:${barColor}"></span></div><span class="mono">${pct0(a.rem)}</span></div></td>
      <td>${wins}</td>
      <td class="mono">${credits.length ? `${credits.length} <span class="note">· first expires ${esc(new Date(credits[0]).toLocaleDateString([], { month: "short", day: "numeric" }))}</span>` : `<span class="note">—</span>`}</td>
      <td class="mono">${Math.round(c.score).toLocaleString()}</td>
      <td>${badges.join("") || `<span class="note">—</span>`}</td>
    </tr>`;
  }).join("");
  return `<section class="card">
    <div class="card-head">${P.icon}<span class="name">${P.name}</span><span class="count">${m.accounts.length} account${m.accounts.length === 1 ? "" : "s"}</span></div>
    <div class="summary">
      <div class="big mono">${pct0(m.remaining)}<small>of ${pct0(m.capacity)}</small></div>
      <div class="stats">
        <div class="stat"><div class="k">Pool empty</div><div class="v mono">${pe}</div></div>
        <div class="stat"><div class="k">First empty</div><div class="v mono">${fe}</div></div>
        <div class="stat"><div class="k">Next reset</div><div class="v mono">${nr}</div></div>
        <div class="stat"><div class="k">Burn, last ${state.burnH}h</div><div class="v mono">${burn}</div></div>
      </div>
    </div>
    <div class="chart" data-provider="${m.provider}"></div>
    <div class="legend"><span>Pool</span><span><i style="border-color:${P.color}"></i>Recorded</span><span><i class="dash" style="border-color:${P.color}"></i>Projected</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Account</th><th>Remaining</th><th>Windows</th><th>Banked resets</th><th>Score</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </section>`;
}

function render() {
  const app = document.getElementById("app");
  if (!state.key) {
    app.innerHTML = `<div class="card login">
      <div class="brand"><div class="logo">${PROVIDERS.claude.icon}</div>Hub Quota</div>
      <form id="login"><input id="key" type="password" autocomplete="current-password" placeholder="Management key" aria-label="Management key">
      <div class="err">${esc(state.error)}</div><button class="btn primary" type="submit">Open dashboard</button></form>
      <p class="note">The key is the hub's management secret-key. It stays in this browser.</p></div>`;
    document.getElementById("login").addEventListener("submit", (e) => {
      e.preventDefault();
      state.key = document.getElementById("key").value.trim();
      state.error = "";
      store.set("key", state.key);
      load();
    });
    return;
  }
  const r = state.report, now = Date.now();
  const creds = r ? r.credentials : [];
  const counts = { all: creds.length, claude: 0, codex: 0 };
  for (const c of creds) if (counts[c.provider] != null) counts[c.provider]++;
  const byId = {};
  for (const s of state.samples) (byId[s.id] ||= []).push(s);
  const opts = { burnH: state.burnH, pastD: state.pastD, futureD: state.futureD };
  const models = Object.keys(PROVIDERS)
    .filter((p) => (state.tab === "all" || state.tab === p) && counts[p] > 0)
    .map((p) => buildProvider(p, creds.filter((c) => c.provider === p), byId, now, opts));
  const polled = creds.length ? Math.max(...creds.map((c) => Date.parse(c.fetched_at))) : 0;
  app.innerHTML = `
    <header class="top">
      <h1>Quota</h1>
      <span class="sub">${creds.length} credentials · ${r && r.enabled ? "usage-aware routing" : "usage-aware routing <b>off</b>"}${polled ? " · polled " + fmtDur(now - polled) + " ago" : ""}</span>
      <span class="spacer"></span>
      <button class="btn" id="emails">${state.showEmails ? "Hide" : "Show"} emails</button>
      <button class="btn primary" id="refresh" ${state.refreshing ? "disabled" : ""}>${state.refreshing ? "Refreshing…" : "Refresh all credentials"}</button>
      <button class="btn icon" id="theme" title="Toggle theme" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="btn icon" id="logout" title="Sign out" aria-label="Sign out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg></button>
    </header>
    ${state.error ? `<div class="card err">${esc(state.error)}</div>` : ""}
    <div class="bar">
      ${seg("", "tab", [["all", `All <span class="n">${counts.all}</span>`], ["claude", `${PROVIDERS.claude.icon} Claude <span class="n">${counts.claude}</span>`], ["codex", `${PROVIDERS.codex.icon} Codex <span class="n">${counts.codex}</span>`]], state.tab)}
      ${seg("Burn rate", "burnH", [[1, "1h"], [3, "3h"], [6, "6h"], [24, "24h"]], state.burnH)}
      ${seg("History", "pastD", [[1, "1d"], [3, "3d"], [7, "7d"], [14, "14d"]], state.pastD)}
      ${seg("Projection", "futureD", [[3, "3d"], [7, "7d"], [14, "14d"]], state.futureD)}
    </div>
    ${!r ? `<div class="empty">Loading…</div>` : models.length ? models.map((m) => providerCard(m, now)).join("") : `<div class="empty">No Claude or Codex OAuth credentials with usage data yet.</div>`}
    <p class="note">New sessions bind to the highest-score account and stay there (session affinity); an account at its limit drops out of rotation until it resets. Projection assumes each window keeps its recorded burn rate; a reset restores that window. History accrues from the hub's usage polls.</p>`;
  models.forEach((m) => {
    const el = app.querySelector(`.chart[data-provider="${m.provider}"]`);
    if (el) renderChart(el, m, now, opts);
  });
  app.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.set, v = k === "tab" ? b.dataset.v : Number(b.dataset.v);
    state[k] = v; store.set(k, v);
    if (k === "pastD" && v * 24 > state.loadedHours) load(); else render();
  }));
  document.getElementById("emails").onclick = () => { state.showEmails = !state.showEmails; store.set("showEmails", state.showEmails); render(); };
  document.getElementById("refresh").onclick = refreshAll;
  document.getElementById("theme").onclick = () => {
    const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
    const next = dark ? "light" : "dark";
    document.documentElement.dataset.theme = next; store.set("theme", next); render();
  };
  document.getElementById("logout").onclick = () => { store.del("key"); state.key = ""; state.report = null; render(); };
}

/* ---------- data ---------- */
async function api(path, method) {
  const res = await fetch("/v8/management" + path, { method: method || "GET", headers: { Authorization: "Bearer " + state.key } });
  if (res.status === 401 || res.status === 403) {
    state.key = ""; store.del("key"); state.error = "That key was rejected. Enter the management key.";
    throw new Error("unauthorized");
  }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.status + " " + res.statusText);
  return body;
}
async function load() {
  if (!state.key || state.loading) return render();
  state.loading = true;
  try {
    const hours = Math.max(24, state.pastD * 24 + 24);
    const [report, hist] = await Promise.all([api("/routing/usage"), api("/routing/usage/history?hours=" + hours)]);
    state.report = report; state.samples = hist.samples || []; state.loadedHours = hours; state.error = ""; state.lastLoad = Date.now();
  } catch (e) {
    if (e.message !== "unauthorized") state.error = "Couldn't load usage: " + e.message;
  } finally {
    state.loading = false;
    render();
  }
}
async function refreshAll() {
  state.refreshing = true; render();
  try { await api("/routing/usage/refresh", "POST"); } catch (e) { if (e.message !== "unauthorized") state.error = "Refresh failed: " + e.message; }
  state.refreshing = false;
  await load();
}
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 120); });
setInterval(() => { if (state.key && !document.hidden) load(); }, 60e3);
load();
</script>
</body>
</html>
